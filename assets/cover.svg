<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151b3a"/>
      <stop offset="1" stop-color="#2a1747"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a21b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a55"/>
      <stop offset="1" stop-color="#101633"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 160H1280M0 320H1280M0 480H1280M320 0V640M640 0V640M960 0V640"/>
  </g>
  <circle cx="930" cy="330" r="300" fill="url(#glow)"/>

  <!-- handheld console -->
  <g transform="translate(640 175)">
    <rect x="0" y="0" width="580" height="300" rx="120" fill="#1a1f33" stroke="#3b4366" stroke-width="4"/>
    <rect x="130" y="34" width="320" height="232" rx="18" fill="url(#screen)" stroke="#000" stroke-opacity="0.5" stroke-width="4"/>
    <!-- d-pad -->
    <g fill="#2e3557">
      <rect x="56" y="96" width="24" height="72" rx="5"/>
