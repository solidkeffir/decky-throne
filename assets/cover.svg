  <!-- crown -->
  <g transform="translate(72 118)">
    <path d="M8 98 L0 18 L44 56 L72 0 L100 56 L144 18 L136 98 Z" fill="url(#gold)" stroke="#b67a07" stroke-width="4" stroke-linejoin="round"/>
    <rect x="8" y="104" width="128" height="20" rx="6" fill="url(#gold)" stroke="#b67a07" stroke-width="4"/>
    <circle cx="72" cy="66" r="10" fill="#7c5cff"/>
  </g>

  <text x="72" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#ffffff">Throne VPN</text>
  <text x="72" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#c9b8ff">for Steam Deck</text>
  <text x="72" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9aa6d6">Game Mode VPN · Decky plugin · one-script installer</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="72" y="476" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
    <text x="116" y="499" text-anchor="middle" fill="#dfe6ff">VLESS</text>
    <rect x="170" y="476" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
    <text x="220" y="499" text-anchor="middle" fill="#dfe6ff">Reality</text>
    <rect x="280" y="476" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
    <text x="326" y="499" text-anchor="middle" fill="#dfe6ff">XHTTP</text>
    <rect x="382" y="476" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
    <text x="446" y="499" text-anchor="middle" fill="#dfe6ff">Hysteria2</text>
    <rect x="520" y="476" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
    <text x="566" y="499" text-anchor="middle" fill="#dfe6ff">+ more</text>
  </g>
  <text x="72" y="585" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6f7aa8">powered by Throne · sing-box</text>
</svg>
