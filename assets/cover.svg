      <circle cx="538" cy="122" r="13"/>
      <circle cx="486" cy="122" r="13"/>
      <circle cx="512" cy="148" r="13"/>
    </g>
    <circle cx="512" cy="214" r="26" fill="#252b47" stroke="#3b4366" stroke-width="3"/>

    <!-- quick access panel on the screen -->
    <g transform="translate(150 52)">
      <text x="0" y="22" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#dfe6ff">Throne VPN</text>
      <rect x="0" y="38" width="280" height="44" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <circle cx="20" cy="60" r="7" fill="#4ade80"/>
      <text x="36" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e8ecff">Connected</text>
      <rect x="212" y="48" width="56" height="24" rx="12" fill="#3b82f6"/>
      <circle cx="256" cy="60" r="9" fill="#fff"/>
      <rect x="0" y="92" width="280" height="30" rx="6" fill="#ffffff" fill-opacity="0.04"/>
      <text x="12" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9fb0ff">● Reality · 42 ms</text>
      <rect x="0" y="128" width="280" height="30" rx="6" fill="#ffffff" fill-opacity="0.04"/>
      <text x="12" y="149" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c7cfef">XHTTP TLS · 57 ms</text>
      <rect x="0" y="164" width="280" height="30" rx="6" fill="#7c5cff" fill-opacity="0.35"/>
      <text x="140" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff">Best server</text>
    </g>
